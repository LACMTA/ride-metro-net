name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test
        env:
          API_KEY: ${{ secrets.API_KEY }}
          # ESRI_KEY is required by the env schema in astro.config.mjs (any
          # build importing `astro:env/client` validates it, e.g. the survey
          # modal). It's a public client key, kept in Secrets to mirror the
          # local .env file. Configure under Settings -> Secrets and
          # variables -> Actions; an empty value fails validation with
          # "ESRI_KEY is missing".
          ESRI_KEY: ${{ secrets.ESRI_KEY }}
